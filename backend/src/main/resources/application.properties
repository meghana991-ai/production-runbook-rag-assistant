spring.application.name=runbook-rag
spring.application.name=production-runbook-rag-assistant
management.endpoints.web.exposure.include=health,info
server.error.include-message=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
rag.embedding.provider=${RAG_EMBEDDING_PROVIDER:local}
rag.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
rag.embedding.dimensions=256
rag.answer.provider=${RAG_ANSWER_PROVIDER:local}
rag.answer.model=${OPENAI_ANSWER_MODEL:gpt-5-mini}
rag.elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}
rag.elasticsearch.index=${ELASTICSEARCH_INDEX:runbook-chunks}
